<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>KrolekVPNReborn — Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at center, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0) 80%);
            animation: orangePulse 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 70% 30%, rgba(255, 159, 74, 0.08) 0%, rgba(255, 107, 53, 0) 70%);
            animation: orangePulseReverse 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes orangePulse {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        
        @keyframes orangePulseReverse {
            0% { opacity: 0.5; transform: scale(1.2); }
            100% { opacity: 0.2; transform: scale(1); }
        }
        
        .login-container {
            max-width: 450px;
            width: 90%;
            margin: 20px;
            padding: 30px 25px;
            background: rgba(20, 20, 28, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border: 1px solid rgba(255, 107, 53, 0.3);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.5s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .logo h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #ff6b35, #ff9f4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .logo p {
            font-size: 14px;
            color: #aaa;
            margin-top: 8px;
        }
        
        .btn-telegram {
            background: #2787f5;
            border: none;
            padding: 14px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-telegram:hover {
            background: #1a6bc4;
            transform: scale(1.02);
        }
        
        .btn-email {
            background: white;
            border: none;
            padding: 14px;
            border-radius: 50px;
            color: #1a1a1a;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }
        .btn-email:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }
        
        .divider {
            text-align: center;
            margin: 20px 0;
            color: #666;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .input-group input:focus {
            border-color: #ff6b35;
        }
        
        .login-btn {
            background: linear-gradient(135deg, #ff6b35, #ff9f4a);
            border: none;
            padding: 14px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        
        .back-btn {
            background: none;
            border: none;
            color: #ff9f4a;
            cursor: pointer;
            margin-top: 15px;
            font-size: 14px;
        }
        
        .toast-notify {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
            font-weight: 500;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast-notify.success {
            background: #1a5c2a;
            border-left: 4px solid #4caf50;
            color: white;
        }
        .toast-notify.error {
            background: #5c1a1a;
            border-left: 4px solid #ff4444;
            color: white;
        }
        
        .hidden {
            display: none;
        }
        
        /* Основной сайт (после входа) */
        .main-site {
            display: none;
            width: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Форма входа -->
    <div id="loginForm" class="login-container">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/kangaroo255075-collab/Website-KrolekVPNReborn/main/IMG_20260419_180656_143.jpg" class="logo-icon" alt="KrolekVPN">
            <h1>KrolekVPNReborn</h1>
            <p>чистый VPN без скрытых условий</p>
        </div>
        
        <button class="btn-telegram" id="telegramLoginBtn">
            <i class="fab fa-telegram"></i> Войти через Telegram
        </button>
        <div class="divider">или</div>
        <button class="btn-email" id="emailLoginBtn">
            <i class="fas fa-envelope"></i> Войти через Email
        </button>
    </div>

    <!-- Форма ввода номера телефона (Telegram) -->
    <div id="telegramPhoneForm" class="login-container hidden">
        <div class="logo">
            <h2>📱 Вход через Telegram</h2>
        </div>
        <div class="input-group">
            <label>Введите ваш номер телефона:</label>
            <input type="tel" id="phoneInput" placeholder="+7 123 456 78 90">
        </div>
        <button class="login-btn" id="sendPhoneBtn">Продолжить</button>
        <button class="back-btn" id="backFromPhone">← Назад</button>
    </div>

    <!-- Форма ввода кода (Telegram) -->
    <div id="telegramCodeForm" class="login-container hidden">
        <div class="logo">
            <h2>🔐 Подтверждение</h2>
        </div>
        <div class="input-group">
            <label>Введите пин-код, отправленный в Telegram:</label>
            <input type="text" id="telegramCodeInput" placeholder="123456">
        </div>
        <button class="login-btn" id="verifyTelegramBtn">Войти</button>
        <button class="back-btn" id="backFromTelegramCode">← Назад</button>
    </div>

    <!-- Форма ввода email -->
    <div id="emailForm" class="login-container hidden">
        <div class="logo">
            <h2>📩 Вход через Email</h2>
        </div>
        <div class="input-group">
            <label>Введите вашу активную электронную почту:</label>
            <input type="email" id="emailInput" placeholder="example@mail.ru">
        </div>
        <button class="login-btn" id="sendEmailBtn">Продолжить</button>
        <button class="back-btn" id="backFromEmail">← Назад</button>
    </div>

    <!-- Форма ввода кода (Email) -->
    <div id="emailCodeForm" class="login-container hidden">
        <div class="logo">
            <h2>🔐 Подтверждение</h2>
        </div>
        <div class="input-group">
            <label>Введите пин-код, отправленный на вашу почту:</label>
            <input type="text" id="emailCodeInput" placeholder="123456">
        </div>
        <button class="login-btn" id="verifyEmailBtn">Войти</button>
        <button class="back-btn" id="backFromEmailCode">← Назад</button>
    </div>

    <!-- Основной сайт (после успешного входа) -->
    <div id="mainSite" class="main-site"></div>

    <div id="toastMessage" class="toast-notify"></div>

    <script>
        // Демо-версия: правильный код = 123456
        const DEMO_CODE = "123456";
        let currentPhone = "";
        let currentEmail = "";
        
        function showToast(message, type) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.className = `toast-notify ${type}`;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3000);
        }
        
        function showLoginSuccess() {
            showToast('✅ Вы подключились', 'success');
            setTimeout(() => {
                // Загружаем основной сайт
                loadMainSite();
            }, 1000);
        }
        
        function loadMainSite() {
            // Здесь будет полный код основного сайта
            const mainSite = document.getElementById('mainSite');
            mainSite.innerHTML = `
                <iframe src="about:blank" style="width:100%;height:100vh;border:none;" id="siteFrame"></iframe>
            `;
            // Скрываем все формы, показываем основной сайт
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('telegramPhoneForm').classList.add('hidden');
            document.getElementById('telegramCodeForm').classList.add('hidden');
            document.getElementById('emailForm').classList.add('hidden');
            document.getElementById('emailCodeForm').classList.add('hidden');
            mainSite.style.display = 'block';
            document.body.style.display = 'block';
            document.body.style.padding = '0';
            
            // Загружаем реальный сайт в iframe
            document.getElementById('siteFrame').src = window.location.href.split('?')[0] + '?loggedin=1';
        }
        
        // Переключение между формами
        document.getElementById('telegramLoginBtn').onclick = () => {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('telegramPhoneForm').classList.remove('hidden');
        };
        
        document.getElementById('emailLoginBtn').onclick = () => {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('emailForm').classList.remove('hidden');
        };
        
        document.getElementById('sendPhoneBtn').onclick = () => {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                showToast('❌ Введите номер телефона', 'error');
                return;
            }
            currentPhone = phone;
            // В реальной версии здесь был бы запрос к серверу
            showToast('📨 Код 123456 отправлен в Telegram (демо-режим)', 'success');
            setTimeout(() => {
                document.getElementById('telegramPhoneForm').classList.add('hidden');
                document.getElementById('telegramCodeForm').classList.remove('hidden');
            }, 1000);
        };
        
        document.getElementById('verifyTelegramBtn').onclick = () => {
            const code = document.getElementById('telegramCodeInput').value.trim();
            if (code === DEMO_CODE) {
                showLoginSuccess();
            } else {
                showToast('❌ Неверный пин-код или номер телефона', 'error');
            }
        };
        
        document.getElementById('sendEmailBtn').onclick = () => {
            const email = document.getElementById('emailInput').value.trim();
            if (!email || !email.includes('@')) {
                showToast('❌ Введите корректный email', 'error');
                return;
            }
            currentEmail = email;
            showToast('📨 Код 123456 отправлен на почту (демо-режим)', 'success');
            setTimeout(() => {
                document.getElementById('emailForm').classList.add('hidden');
                document.getElementById('emailCodeForm').classList.remove('hidden');
            }, 1000);
        };
        
        document.getElementById('verifyEmailBtn').onclick = () => {
            const code = document.getElementById('emailCodeInput').value.trim();
            if (code === DEMO_CODE) {
                showLoginSuccess();
            } else {
                showToast('❌ Неверный пин-код или email', 'error');
            }
        };
        
        // Кнопки "Назад"
        const backBtns = ['backFromPhone', 'backFromTelegramCode', 'backFromEmail', 'backFromEmailCode'];
        backBtns.forEach(id => {
            document.getElementById(id).onclick = () => {
                document.querySelectorAll('.login-container').forEach(el => el.classList.add('hidden'));
                document.getElementById('loginForm').classList.remove('hidden');
            };
        });
        
        // Проверка, если уже залогинены через параметр URL
        if (window.location.search.includes('loggedin=1')) {
            localStorage.setItem('krolek_logged_in', 'true');
        }
        
        if (localStorage.getItem('krolek_logged_in') === 'true') {
            document.getElementById('loginForm').style.display = 'none';
            loadMainSite();
        }
    </script>
</body>
</html>
